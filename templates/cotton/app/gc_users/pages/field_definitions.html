<div
  x-data="{
    active: '{{ initial_tab|default:'field-definitions' }}',
    showStatusDrawer: false,
    showTagDrawer: false,
    showIndustryDrawer: false
  }"
  @close-status-drawer.window="showStatusDrawer = false"
  @close-tag-drawer.window="showTagDrawer = false"
  @close-industry-drawer.window="showIndustryDrawer = false"
  class="flex flex-col h-full"
>
  <c-app.components.workspace.workspace_header>
    <c-app.components.workspace.workspace_title>Settings</c-app.components.workspace.workspace_title>
    <div class="flex items-center gap-4 text-sm font-semibold">
      <button
        type="button"
        class="pb-1 border-b-2 transition"
        style="cursor: pointer;"
        :class="active === 'members' ? 'border-gc-theme-accent text-gc-theme-accent' : 'border-transparent text-gc-light-text-secondary dark:text-gc-dark-text-primary/70'"
        @click="active = 'members'"
        hx-get="{% url 'settings-members' %}"
        hx-target="#htmx_workspace"
        hx-swap="innerHTML"
        hx-push-url="{% url 'settings-members' %}"
      >
        Members
      </button>
      <button
        type="button"
        class="pb-1 border-b-2 transition"
        style="cursor: pointer;"
        :class="active === 'field-definitions' ? 'border-gc-theme-accent text-gc-theme-accent' : 'border-transparent text-gc-light-text-secondary dark:text-gc-dark-text-primary/70'"
        @click="active = 'field-definitions'"
        hx-get="{% url 'settings-field-definitions' %}"
        hx-target="#htmx_workspace"
        hx-swap="innerHTML"
        hx-push-url="{% url 'settings-field-definitions' %}"
      >
        Field Definitions
      </button>
    </div>
  </c-app.components.workspace.workspace_header>

  <div class="mt-4 flex-1 min-h-0">
    <div class="h-full flex flex-col gap-4">
      <div class="space-y-3">
        <div class="flex items-center gap-3">
          <p class="text-sm font-semibold uppercase tracking-wide text-gc-light-text-secondary dark:text-gc-dark-text-primary/70">
            Customer Fields
          </p>
          <div class="flex-1 h-px bg-gc-light-bg-secondary dark:bg-gc-dark-bg-secondary"></div>
        </div>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
          <button
            type="button"
            class="w-full rounded-lg border border-gc-light-bg-secondary dark:border-gc-dark-bg-secondary bg-gc-light-bg-primary dark:bg-gc-dark-bg-primary p-4 text-left shadow-sm hover:border-gc-theme-accent/50 hover:shadow transition"
            style="cursor: pointer;"
            hx-get="{% url 'settings-statuses' %}"
            hx-target="#field_definitions_drawer"
            hx-swap="outerHTML"
            @click="showStatusDrawer = true"
          >
            <p class="text-base font-semibold text-gc-light-text-primary dark:text-gc-dark-text-primary">Customer Status</p>
            <p class="text-sm text-gc-light-text-secondary dark:text-gc-dark-text-primary/70">Manage lifecycle statuses for this workspace.</p>
          </button>
          <button
            type="button"
            class="w-full rounded-lg border border-gc-light-bg-secondary dark:border-gc-dark-bg-secondary bg-gc-light-bg-primary dark:bg-gc-dark-bg-primary p-4 text-left shadow-sm hover:border-gc-theme-accent/50 hover:shadow transition"
            style="cursor: pointer;"
            hx-get="{% url 'settings-tags' %}"
            hx-target="#tag_definitions_drawer"
            hx-swap="outerHTML"
            @click="showTagDrawer = true"
          >
            <p class="text-base font-semibold text-gc-light-text-primary dark:text-gc-dark-text-primary">Customer Tags</p>
            <p class="text-sm text-gc-light-text-secondary dark:text-gc-dark-text-primary/70">Manage reusable customer tags for this workspace.</p>
          </button>
          <button
            type="button"
            class="w-full rounded-lg border border-gc-light-bg-secondary dark:border-gc-dark-bg-secondary bg-gc-light-bg-primary dark:bg-gc-dark-bg-primary p-4 text-left shadow-sm hover:border-gc-theme-accent/50 hover:shadow transition"
            style="cursor: pointer;"
            hx-get="{% url 'settings-industries' %}"
            hx-target="#industry_definitions_drawer"
            hx-swap="outerHTML"
            @click="showIndustryDrawer = true"
          >
            <p class="text-base font-semibold text-gc-light-text-primary dark:text-gc-dark-text-primary">Customer Industries</p>
            <p class="text-sm text-gc-light-text-secondary dark:text-gc-dark-text-primary/70">Manage industry tags for this workspace.</p>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Field Definitions Drawer -->
  <div
    x-show="showStatusDrawer"
    x-cloak
    class="fixed inset-0 z-50"
    x-transition.opacity
  >
    <div class="absolute inset-0 bg-black/50" @click="showStatusDrawer = false"></div>
    <c-app.components.drawers.standard_drawer>
      <div
        id="field_definitions_drawer"
        class="h-full"
      >
        <div class="flex h-full items-center justify-center text-sm text-gc-light-text-secondary dark:text-gc-dark-text-primary/70">
          Loading statuses...
        </div>
      </div>
    </c-app.components.drawers.standard_drawer>
  </div>

  <!-- Tag Definitions Drawer -->
  <div
    x-show="showTagDrawer"
    x-cloak
    class="fixed inset-0 z-50"
    x-transition.opacity
  >
    <div class="absolute inset-0 bg-black/50" @click="showTagDrawer = false"></div>
    <c-app.components.drawers.standard_drawer>
      <div
        id="tag_definitions_drawer"
        class="h-full"
      >
        <div class="flex h-full items-center justify-center text-sm text-gc-light-text-secondary dark:text-gc-dark-text-primary/70">
          Loading tags...
        </div>
      </div>
    </c-app.components.drawers.standard_drawer>
  </div>

  <!-- Industry Definitions Drawer -->
  <div
    x-show="showIndustryDrawer"
    x-cloak
    class="fixed inset-0 z-50"
    x-transition.opacity
  >
    <div class="absolute inset-0 bg-black/50" @click="showIndustryDrawer = false"></div>
    <c-app.components.drawers.standard_drawer>
      <div
        id="industry_definitions_drawer"
        class="h-full"
      >
        <div class="flex h-full items-center justify-center text-sm text-gc-light-text-secondary dark:text-gc-dark-text-primary/70">
          Loading industries...
        </div>
      </div>
    </c-app.components.drawers.standard_drawer>
  </div>
</div>
