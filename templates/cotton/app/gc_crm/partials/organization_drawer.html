<div id="organization_drawer_content" class="flex h-full flex-col">
  <div class="sticky top-0 z-10 flex items-center justify-between border-b border-gc-light-bg-secondary dark:border-gc-dark-bg-secondary px-4 py-3 bg-gc-light-bg-primary dark:bg-gc-dark-bg-primary">
    <div>
      <p class="text-base font-semibold text-gc-light-text-primary dark:text-gc-dark-text-primary">
        {{ organization.name }}
      </p>
      <p class="text-sm text-gc-light-text-secondary dark:text-gc-dark-text-primary/70">
        Edit organization details.
      </p>
    </div>
    <button
      type="button"
      class="rounded p-2 text-gc-light-text-primary dark:text-gc-dark-text-primary hover:bg-gc-light-bg-secondary/30 dark:hover:bg-gc-dark-bg-secondary/20 transition"
      @click="$dispatch('close-org-drawer')"
      aria-label="Close"
    >
      <span class="material-symbols-outlined text-lg leading-none">close</span>
    </button>
  </div>

  {% if error %}
  <div class="bg-rose-500/10 text-rose-700 dark:text-rose-300 px-4 py-3 text-sm">
    {{ error }}
  </div>
  {% endif %}
  {% if success %}
  <div class="bg-emerald-500/10 text-emerald-700 dark:text-emerald-300 px-4 py-3 text-sm">
    {{ success }}
  </div>
  {% endif %}

  <div class="flex-1 min-h-0 overflow-y-auto divide-y divide-gc-light-bg-secondary dark:divide-gc-dark-bg-secondary">
    <form
      class="space-y-4 px-4 py-4"
      hx-post="{% url 'crm-organization-edit' organization.id %}"
      hx-target="#organization_drawer_content"
      hx-swap="outerHTML"
    >
      {% csrf_token %}
      <c-app.components.fields.text_field
        id="org_name_{{ organization.id }}"
        name="name"
        label="Name"
        value="{{ organization.name }}"
        required="true"
      />

      <c-app.components.fields.remote_pill_select
        id="org_status_{{ organization.id }}"
        name="status"
        label="Status"
        options_url="{% url 'crm-select-statuses' %}"
        :initial="status_initial"
      />

      <c-app.components.fields.remote_pill_select
        id="org_tags_{{ organization.id }}"
        name="tags"
        label="Tags"
        options_url="{% url 'crm-select-tags' %}"
        multiple="true"
        :initial="tag_initial"
      />

      <c-app.components.fields.textarea_field
        id="org_notes_{{ organization.id }}"
        name="notes"
        label="Notes"
        rows="4"
        value="{{ organization.notes }}"
      />
    </form>
  </div>
  <div class="sticky bottom-0 z-10 border-t border-gc-light-bg-secondary dark:border-gc-dark-bg-secondary bg-gc-light-bg-primary dark:bg-gc-dark-bg-primary px-4 py-3">
    <div class="flex items-center justify-between">
      <div class="text-xs text-gc-light-text-secondary dark:text-gc-dark-text-primary/70">
        Last updated {{ organization.last_updated_at|date:"M d, Y H:i" }}
      </div>
      <button
        form="org_form_{{ organization.id }}"
        type="submit"
        class="inline-flex items-center gap-1 rounded-md bg-gc-theme-accent/90 px-3 py-2 text-sm font-semibold text-white hover:bg-gc-theme-accent transition"
      >
        <span class="material-symbols-outlined text-base leading-none">save</span>
        Save
      </button>
    </div>
  </div>
</div>

<template hx-swap-oob="outerHTML">
  {% include "cotton/app/gc_crm/partials/organization_row.html" with org=organization %}
</template>
