<div
  id="organization_drawer_content"
  class="flex h-full flex-col"
  x-data="{ activeTab: 'general' }"
>
  <c-app.components.drawers.drawer_header
    title="{{ organization.name }}"
    close_event="close-org-drawer"
  >
    <div class="mt-3 flex items-center gap-4 text-sm font-semibold">
      <button
        type="button"
        class="pb-1 border-b-2 transition"
        style="cursor: pointer;"
        :class="activeTab === 'general'
          ? 'border-gc-theme-accent text-gc-theme-accent'
          : 'border-transparent text-gc-light-text-secondary dark:text-gc-dark-text-primary/70'
        "
        @click="activeTab = 'general'"
      >
        General
      </button>
      <button
        type="button"
        class="pb-1 border-b-2 transition"
        style="cursor: pointer;"
        :class="activeTab === 'notes'
          ? 'border-gc-theme-accent text-gc-theme-accent'
          : 'border-transparent text-gc-light-text-secondary dark:text-gc-dark-text-primary/70'
        "
        @click="activeTab = 'notes'"
      >
        Notes
      </button>
    </div>
  </c-app.components.drawers.drawer_header>

  {% if error %}
  <div class="bg-rose-500/10 text-rose-700 dark:text-rose-300 px-4 py-3 text-sm">
    {{ error }}
  </div>
  {% endif %}

  <div class="flex-1 min-h-0 overflow-y-auto divide-y divide-gc-light-bg-secondary dark:divide-gc-dark-bg-secondary">
    <form
      id="org_form_{{ organization.id }}"
      class="space-y-4 px-4 py-4"
      hx-post="{% url 'crm-organization-edit' organization.id %}"
      hx-target="#organization_drawer_content"
      hx-swap="outerHTML"
    >
      {% csrf_token %}
      <div x-show="activeTab === 'general'" x-cloak class="space-y-4">
        <c-app.components.fields.text_field
          id="org_name_{{ organization.id }}"
          name="name"
          label="Name"
          value="{{ organization.name }}"
          required="true"
        />

        <c-app.components.fields.remote_pill_select
          id="org_status_{{ organization.id }}"
          name="status"
          label="Status"
          options_url="{% url 'crm-select-statuses' %}"
          :initial="status_initial"
        />

        <c-app.components.fields.remote_pill_select
          id="org_tags_{{ organization.id }}"
          name="tags"
          label="Tags"
          options_url="{% url 'crm-select-tags' %}"
          multiple="true"
          :initial="tag_initial"
        />
      </div>

      <div x-show="activeTab === 'notes'" x-cloak>
        <c-app.components.fields.textarea_field
          id="org_notes_{{ organization.id }}"
          name="notes"
          label="Notes"
          rows="4"
          value="{{ organization.notes }}"
        />
      </div>
    </form>
  </div>
  <c-app.components.drawers.drawer_footer>
    <div class="flex items-center justify-between">
      <div class="text-xs text-gc-light-text-secondary dark:text-gc-dark-text-primary/70">
        Last updated {{ organization.last_updated_at|date:"M d, Y H:i" }}
      </div>
      <c-app.components.buttons.primary_button
        form="org_form_{{ organization.id }}"
        type="submit"
        icon="save"
        label="Save"
        extra_classes="px-3 py-2"
      />
    </div>
  </c-app.components.drawers.drawer_footer>
</div>

<div class="hidden" aria-hidden="true">
  <table>
    <tbody>
      {% include "cotton/app/gc_crm/partials/organization_row.html" with org=organization oob="outerHTML" %}
    </tbody>
  </table>
</div>

{% if success %}
<div hx-swap-oob="afterbegin:#toast_container">
  <c-app.components.toasts.toast>{{ success }}</c-app.components.toasts.toast>
</div>
{% endif %}
