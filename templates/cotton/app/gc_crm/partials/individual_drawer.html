<div
  id="individual_drawer_content"
  class="flex h-full flex-col"
  x-data="individualDrawer({
    activeTab: '{{ active_tab|default:'general'|escapejs }}',
    deleteUrl: '{{ delete_url|default:'' }}',
    listRefreshUrl: '{{ list_refresh_url|default_if_none:'' }}',
  })"
>
  <c-app.components.drawers.drawer_header
    title="{% if individual.first_name or individual.last_name %}{{ individual.first_name }} {{ individual.last_name }}{% elif individual.email %}{{ individual.email }}{% else %}New Individual{% endif %}"
    close_event="close-individual-drawer"
  >
    <div class="mt-3 flex items-center gap-4 text-sm font-semibold">
      <c-app.components.tabs.changeform_tab tab_id="general" label="General" />
      <c-app.components.tabs.changeform_tab tab_id="address" label="Address" />
      <c-app.components.tabs.changeform_tab tab_id="notes" label="Notes" />
    </div>
  </c-app.components.drawers.drawer_header>

  <c-app.components.errors.form_error error="{{ error|default_if_none:'' }}" />

  <div class="flex-1 min-h-0 overflow-y-auto divide-y divide-gc-light-bg-secondary dark:divide-gc-dark-bg-secondary">
    <form
      id="individual_form_{{ individual.id }}"
      class="space-y-4 px-4 py-4"
      hx-post="{{ save_url }}"
      hx-target="#individual_drawer_content"
      hx-swap="outerHTML"
    >
      {% csrf_token %}
      <input type="hidden" name="active_tab" x-model="activeTab" />
      <div x-show="activeTab === 'general'" x-cloak class="space-y-4">
        <c-app.gc_crm.components.individual_form_general />
      </div>

      <div x-show="activeTab === 'address'" x-cloak class="space-y-4">
        <c-app.gc_crm.components.individual_form_address />
      </div>

      <div x-show="activeTab === 'notes'" x-cloak>
        <c-app.gc_crm.components.individual_form_notes />
      </div>
    </form>
  </div>
  <c-app.components.drawers.drawer_footer>
    <c-app.components.changeforms.changeform_footer_controls
      submit_button_form_id="individual_form_{{ individual.id }}"
      :organization="individual"
      :is_new="is_new"
    />
  </c-app.components.drawers.drawer_footer>
</div>

{% if not is_new %}
<div class="hidden" aria-hidden="true">
  <table>
    <tbody>
      <c-app.gc_crm.partials.individual_row individual="{{ individual }}" edit_url="{{ save_url }}" oob="outerHTML" />
    </tbody>
  </table>
</div>
{% endif %}

{% if refresh_table %}
<div class="hidden">
  <div
    hx-get="{{ list_refresh_url|default_if_none:'' }}"
    hx-target="#crm_table_content"
    hx-swap="innerHTML"
    hx-select="#crm_table_content"
    hx-trigger="load"
  ></div>
</div>
{% endif %}

{% if success %}
<div hx-swap-oob="afterbegin:#toast_container">
  <c-app.components.toasts.toast>{{ success }}</c-app.components.toasts.toast>
</div>
{% endif %}

<script>
  function individualDrawer({ activeTab = "general", deleteUrl = "", listRefreshUrl = "" }) {
    return {
      activeTab,
      deleteConfirm: false,
      deleting: false,
      deleteRecord() {
        if (this.deleting || !deleteUrl) return;
        this.deleting = true;
        fetch(deleteUrl, {
          method: "POST",
          headers: { "X-CSRFToken": getCookie("csrftoken") || "" },
        })
          .then((response) => {
            if (response.ok) {
              window.dispatchEvent(new CustomEvent("close-individual-drawer"));
              htmx.ajax("GET", listRefreshUrl, {
                target: "#crm_table_content",
                swap: "innerHTML",
                select: "#crm_table_content",
              });
            } else {
              this.deleteConfirm = false;
            }
          })
          .catch(() => {
            this.deleteConfirm = false;
          })
          .finally(() => {
            this.deleting = false;
          });
      },
    };
  }
</script>
