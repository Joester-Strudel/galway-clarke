<div
  x-data="{ showOrgDrawer: false }"
  @close-org-drawer.window="showOrgDrawer = false"
  class="flex-1 min-h-0 flex flex-col gap-4"
>
  <c-app.components.tables.table_tools
    search_url="{% url 'crm-organizations' %}"
    hx_target="#crm_table_content"
    hx_select="#crm_table_content"
    :search_query="search_query"
    :filter_fields="filter_fields"
  />

  {% with filter_suffix=filter_querystring|default:'' %}
  <div id="crm_table_content" class="flex-1 min-h-0 h-full rounded-md border border-gc-light-bg-secondary dark:border-gc-dark-bg-secondary bg-gc-light-bg-secondary dark:bg-gc-dark-bg-secondary flex flex-col">
    <div class="flex-1 min-h-0 overflow-auto">
      <c-app.components.tables.table>
        <c-app.components.tables.table_header>
          <tr>
            <c-app.components.tables.table_header_cell>
              <div class="flex items-center gap-2">
                <span>Name</span>
                <div class="flex flex-col text-[11px] leading-none">
                  <button
                    type="button"
                    aria-label="Sort Name ascending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'name' and sort_direction == 'asc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-organizations' %}?sort=name&direction=asc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_suffix }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▲</button>
                  <button
                    type="button"
                    aria-label="Sort Name descending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'name' and sort_direction == 'desc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-organizations' %}?sort=name&direction=desc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_suffix }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▼</button>
                </div>
              </div>
            </c-app.components.tables.table_header_cell>
            <c-app.components.tables.table_header_cell>
              <div class="flex items-center gap-2">
                <span>Status</span>
                <div class="flex flex-col text-[11px] leading-none">
                  <button
                    type="button"
                    aria-label="Sort Status ascending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'status' and sort_direction == 'asc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-organizations' %}?sort=status&direction=asc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_suffix }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▲</button>
                  <button
                    type="button"
                    aria-label="Sort Status descending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'status' and sort_direction == 'desc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-organizations' %}?sort=status&direction=desc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_suffix }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▼</button>
                </div>
              </div>
            </c-app.components.tables.table_header_cell>
            <c-app.components.tables.table_header_cell>
              <div class="flex items-center gap-2">
                <span>City</span>
                <div class="flex flex-col text-[11px] leading-none">
                  <button
                    type="button"
                    aria-label="Sort City ascending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'city' and sort_direction == 'asc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-organizations' %}?sort=city&direction=asc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_suffix }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▲</button>
                  <button
                    type="button"
                    aria-label="Sort City descending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'city' and sort_direction == 'desc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-organizations' %}?sort=city&direction=desc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_suffix }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▼</button>
                </div>
              </div>
            </c-app.components.tables.table_header_cell>
            <c-app.components.tables.table_header_cell>
              <div class="flex items-center gap-2">
                <span>State</span>
                <div class="flex flex-col text-[11px] leading-none">
                  <button
                    type="button"
                    aria-label="Sort State ascending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'state' and sort_direction == 'asc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-organizations' %}?sort=state&direction=asc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_suffix }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▲</button>
                  <button
                    type="button"
                    aria-label="Sort State descending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'state' and sort_direction == 'desc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-organizations' %}?sort=state&direction=desc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_suffix }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▼</button>
                </div>
              </div>
            </c-app.components.tables.table_header_cell>
            <c-app.components.tables.table_header_cell>
              <div class="flex items-center gap-2">
                <span>Industry</span>
                <div class="flex flex-col text-[11px] leading-none">
                  <button
                    type="button"
                    aria-label="Sort Industry ascending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'industry' and sort_direction == 'asc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-organizations' %}?sort=industry&direction=asc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_suffix }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▲</button>
                  <button
                    type="button"
                    aria-label="Sort Industry descending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'industry' and sort_direction == 'desc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-organizations' %}?sort=industry&direction=desc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_suffix }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▼</button>
                </div>
              </div>
            </c-app.components.tables.table_header_cell>
            <c-app.components.tables.table_header_cell>
              <div class="flex items-center gap-2">
                <span>Primary Contact</span>
                <div class="flex flex-col text-[11px] leading-none">
                  <button
                    type="button"
                    aria-label="Sort Primary Contact ascending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'primary_contact' and sort_direction == 'asc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-organizations' %}?sort=primary_contact&direction=asc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_suffix }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▲</button>
                  <button
                    type="button"
                    aria-label="Sort Primary Contact descending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'primary_contact' and sort_direction == 'desc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-organizations' %}?sort=primary_contact&direction=desc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_suffix }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▼</button>
                </div>
              </div>
            </c-app.components.tables.table_header_cell>
            <c-app.components.tables.table_header_cell>
              <div class="flex items-center gap-2">
                <span>Last Activity</span>
                <div class="flex flex-col text-[11px] leading-none">
                  <button
                    type="button"
                    aria-label="Sort Last Activity ascending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'last_activity' and sort_direction == 'asc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-organizations' %}?sort=last_activity&direction=asc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_suffix }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▲</button>
                  <button
                    type="button"
                    aria-label="Sort Last Activity descending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'last_activity' and sort_direction == 'desc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-organizations' %}?sort=last_activity&direction=desc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_suffix }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▼</button>
                </div>
              </div>
            </c-app.components.tables.table_header_cell>
            <c-app.components.tables.table_header_cell>Tags</c-app.components.tables.table_header_cell>
          </tr>
        </c-app.components.tables.table_header>
        <tbody>
          {% for org in page_obj %}
            {% include "cotton/app/gc_crm/partials/organization_row.html" with org=org %}
          {% empty %}
            <c-app.components.empty.no_records message="No organizations yet." />
          {% endfor %}
        </tbody>
      </c-app.components.tables.table>
    </div>
    <c-app.components.tables.table_controls
      :page_obj="page_obj"
      page_url="{% url 'crm-organizations' %}"
      hx_target="#crm_table_content"
      hx_select="#crm_table_content"
      sort_field="{{ sort_field }}"
      sort_direction="{{ sort_direction }}"
      search_query="{{ search_query }}"
      filter_querystring="{{ filter_querystring }}"
    />
  </div>
  <!-- Organization drawer -->
  <div
    x-show="showOrgDrawer"
    x-cloak
    class="fixed inset-0 z-50"
    x-transition.opacity
  >
    <div class="absolute inset-0 bg-black/50" @click="showOrgDrawer = false"></div>
    <aside
      class="absolute right-0 top-0 flex h-full w-[640px] max-w-full flex-col border-l border-gc-light-bg-secondary dark:border-gc-dark-bg-secondary bg-gc-light-bg-primary dark:bg-gc-dark-bg-primary text-gc-light-text-primary dark:text-gc-dark-text-primary shadow-2xl"
      x-transition:enter="transition transform ease-out duration-300"
      x-transition:enter-start="translate-x-full"
      x-transition:enter-end="translate-x-0"
      x-transition:leave="transition transform ease-in duration-200"
      x-transition:leave-start="translate-x-0"
      x-transition:leave-end="translate-x-full"
    >
      <div id="organization_drawer_content" class="h-full">
        <div class="flex h-full items-center justify-center text-sm text-gc-light-text-secondary dark:text-gc-dark-text-primary/70">
          Select an organization to edit.
        </div>
      </div>
    </aside>
  </div>
  {% endwith %}
</div>
