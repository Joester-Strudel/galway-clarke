<div
  x-data="{ showIndividualDrawer: false }"
  @close-individual-drawer.window="showIndividualDrawer = false"
  @open-individual-drawer.window="showIndividualDrawer = true"
  class="flex-1 min-h-0 flex flex-col gap-4"
>
  <c-app.components.tables.table_tools
    search_url="{% url 'crm-individuals' %}"
    hx_target="#crm_table_content"
    hx_select="#crm_table_content"
    :search_query="search_query"
    :filter_fields="filter_fields"
    filter_form_id="individual_filters_form"
    add_url="{% url 'crm-individual-create' %}"
    add_target="#individual_drawer_content"
    add_swap="outerHTML"
    add_open_event="open-individual-drawer"
  />

  <div id="crm_table_content" class="flex-1 min-h-0 h-full rounded-md border border-gc-light-bg-secondary dark:border-gc-dark-bg-secondary bg-gc-light-bg-secondary dark:bg-gc-dark-bg-secondary flex flex-col">
    <div class="flex-1 min-h-0 overflow-auto">
      <c-app.components.tables.table>
        <c-app.components.tables.table_header>
          <tr>
            <c-app.components.tables.table_header_cell>
              <div class="flex items-center gap-2">
                <span>Name</span>
                <div class="flex flex-col text-[11px] leading-none">
                  <button
                    type="button"
                    aria-label="Sort Name ascending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'name' and sort_direction == 'asc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-individuals' %}?sort=name&direction=asc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_querystring|default:'' }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▲</button>
                  <button
                    type="button"
                    aria-label="Sort Name descending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'name' and sort_direction == 'desc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-individuals' %}?sort=name&direction=desc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_querystring|default:'' }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▼</button>
                </div>
              </div>
            </c-app.components.tables.table_header_cell>
            <c-app.components.tables.table_header_cell>
              <div class="flex items-center gap-2">
                <span>Email</span>
                <div class="flex flex-col text-[11px] leading-none">
                  <button
                    type="button"
                    aria-label="Sort Email ascending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'email' and sort_direction == 'asc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-individuals' %}?sort=email&direction=asc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_querystring|default:'' }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▲</button>
                  <button
                    type="button"
                    aria-label="Sort Email descending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'email' and sort_direction == 'desc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-individuals' %}?sort=email&direction=desc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_querystring|default:'' }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▼</button>
                </div>
              </div>
            </c-app.components.tables.table_header_cell>
            <c-app.components.tables.table_header_cell>
              <div class="flex items-center gap-2">
                <span>Phone</span>
                <div class="flex flex-col text-[11px] leading-none">
                  <button
                    type="button"
                    aria-label="Sort Phone ascending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'phone' and sort_direction == 'asc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-individuals' %}?sort=phone&direction=asc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_querystring|default:'' }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▲</button>
                  <button
                    type="button"
                    aria-label="Sort Phone descending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'phone' and sort_direction == 'desc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-individuals' %}?sort=phone&direction=desc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_querystring|default:'' }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▼</button>
                </div>
              </div>
            </c-app.components.tables.table_header_cell>
            <c-app.components.tables.table_header_cell>
              <div class="flex items-center gap-2">
                <span>Organization</span>
                <div class="flex flex-col text-[11px] leading-none">
                  <button
                    type="button"
                    aria-label="Sort Organization ascending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'organization' and sort_direction == 'asc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-individuals' %}?sort=organization&direction=asc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_querystring|default:'' }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▲</button>
                  <button

                    class="hover:text-gc-theme-accent {% if sort_field == 'organization' and sort_direction == 'desc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-individuals' %}?sort=organization&direction=desc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_querystring|default:'' }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▼</button>
                </div>
              </div>
            </c-app.components.tables.table_header_cell>
            <c-app.components.tables.table_header_cell>
              <div class="flex items-center gap-2">
                <span>City</span>
                <div class="flex flex-col text-[11px] leading-none">
                  <button
                    type="button"
                    aria-label="Sort City ascending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'city' and sort_direction == 'asc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-individuals' %}?sort=city&direction=asc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_querystring|default:'' }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▲</button>
                  <button
                    type="button"
                    aria-label="Sort City descending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'city' and sort_direction == 'desc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-individuals' %}?sort=city&direction=desc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_querystring|default:'' }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▼</button>
                </div>
              </div>
            </c-app.components.tables.table_header_cell>
            <c-app.components.tables.table_header_cell>
              <div class="flex items-center gap-2">
                <span>State</span>
                <div class="flex flex-col text-[11px] leading-none">
                  <button
                    type="button"
                    aria-label="Sort State ascending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'state' and sort_direction == 'asc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-individuals' %}?sort=state&direction=asc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_querystring|default:'' }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▲</button>
                  <button
                    type="button"
                    aria-label="Sort State descending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'state' and sort_direction == 'desc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-individuals' %}?sort=state&direction=desc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_querystring|default:'' }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▼</button>
                </div>
              </div>
            </c-app.components.tables.table_header_cell>
            <c-app.components.tables.table_header_cell>
              <div class="flex items-center gap-2">
                <span>Primary</span>
                <div class="flex flex-col text-[11px] leading-none">
                  <button
                    type="button"
                    aria-label="Sort Primary ascending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'primary' and sort_direction == 'asc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-individuals' %}?sort=primary&direction=asc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_querystring|default:'' }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▲</button>
                  <button
                    type="button"
                    aria-label="Sort Primary descending"
                    class="hover:text-gc-theme-accent {% if sort_field == 'primary' and sort_direction == 'desc' %}text-gc-theme-accent{% endif %}"
                    hx-get="{% url 'crm-individuals' %}?sort=primary&direction=desc{% if search_query %}&search={{ search_query|urlencode }}{% endif %}{{ filter_querystring|default:'' }}"
                    hx-target="#crm_table_content"
                    hx-swap="innerHTML"
                    hx-select="#crm_table_content"
                  >▼</button>
                </div>
              </div>
            </c-app.components.tables.table_header_cell>
            <c-app.components.tables.table_header_cell>Tags</c-app.components.tables.table_header_cell>
          </tr>
        </c-app.components.tables.table_header>
        <tbody>
          {% for individual in page_obj %}
            {% include "cotton/app/gc_crm/partials/individual_row.html" with individual=individual %}
          {% empty %}
            <c-app.components.empty.no_records message="No individuals yet." />
          {% endfor %}
        </tbody>
      </c-app.components.tables.table>
    </div>
    <c-app.components.tables.table_controls
      :page_obj="page_obj"
      page_url="{% url 'crm-individuals' %}"
      hx_target="#crm_table_content"
      hx_select="#crm_table_content"
      sort_field="{{ sort_field }}"
      sort_direction="{{ sort_direction }}"
      search_query="{{ search_query }}"
      filter_querystring="{{ filter_querystring }}"
    />
  </div>

  <div
    x-show="showIndividualDrawer"
    x-cloak
    class="fixed inset-0 z-50"
    x-transition.opacity
  >
    <div class="absolute inset-0 bg-black/50" @click="showIndividualDrawer = false"></div>
    <c-app.components.drawers.wide_drawer>
      <div id="individual_drawer_content" class="h-full">
        <div class="flex h-full items-center justify-center text-sm text-gc-light-text-secondary dark:text-gc-dark-text-primary/70">
          Select an individual to edit.
        </div>
      </div>
    </c-app.components.drawers.wide_drawer>
  </div>
</div>
