{% comment %}
Address tab fields for individual form.
Expects:
- individual
- city_initial, state_initial, county_initial, zip_initial
{% endcomment %}
<c-app.components.fields.text_field
  id="individual_address_one_{{ individual.id }}"
  name="address_one"
  label="Address Line 1"
  value="{{ individual.address_one|default:'' }}"
/>

<c-app.components.fields.text_field
  id="individual_address_two_{{ individual.id }}"
  name="address_two"
  label="Address Line 2"
  value="{{ individual.address_two|default:'' }}"
/>

<c-app.components.fields.remote_pill_select
  id="individual_city_{{ individual.id }}"
  name="location_city"
  label="City"
  options_url="{% url 'crm-select-cities' %}"
  :initial="city_initial"
/>

<c-app.components.fields.remote_pill_select
  id="individual_state_{{ individual.id }}"
  name="location_state"
  label="State/Region"
  options_url="{% url 'crm-select-states' %}"
  :initial="state_initial"
/>

<c-app.components.fields.remote_pill_select
  id="individual_county_{{ individual.id }}"
  name="location_county"
  label="County"
  options_url="{% url 'crm-select-counties' %}"
  :initial="county_initial"
/>

<c-app.components.fields.remote_pill_select
  id="individual_zip_{{ individual.id }}"
  name="location_zip"
  label="ZIP Code"
  options_url="{% url 'crm-select-zip-codes' %}"
  :initial="zip_initial"
/>
