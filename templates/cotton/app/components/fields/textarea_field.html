<div class="space-y-1">
  <label class="block text-sm font-semibold text-gc-light-text-primary dark:text-gc-dark-text-primary" for="{{ id }}">{{ label }}</label>
  <textarea
    class="w-full min-h-[120px] rounded-lg border border-gc-theme-accent bg-gc-light-bg-primary dark:bg-gc-dark-bg-primary text-base text-gc-light-text-primary dark:text-gc-dark-text-primary placeholder-gc-light-text-secondary/70 dark:placeholder-gc-dark-text-primary/60 px-4 py-3 shadow-sm focus:border-gc-theme-accent focus:ring-2 focus:ring-gc-theme-accent/40 focus:outline-none"
    id="{{ id }}"
    name="{{ name }}"
    rows="{{ rows|default:3 }}"
    {% if required %}required{% endif %}
  >{{ value }}</textarea>
</div>
