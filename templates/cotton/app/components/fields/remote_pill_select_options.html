{% comment %}Rendered via HTMX for remote_pill_select options{% endcomment %}
{% for option in options %}
<button
  type="button"
  class="w-full text-left px-3 py-2 text-sm flex items-center gap-2 hover:bg-gc-light-bg-secondary dark:hover:bg-gc-dark-bg-secondary"
  data-value="{{ option.value }}"
  data-label="{{ option.label }}"
  data-color="{{ option.color|default:'gray' }}"
  @click.prevent="toggleOption($el.dataset.value, $el.dataset.label, $el.dataset.color)"
  :class="isSelected('{{ option.value }}') ? 'bg-gc-light-bg-secondary/70 dark:bg-gc-dark-bg-secondary/60' : ''"
>
  <span
    class="inline-flex items-center gap-1 rounded-full px-2 py-1 text-xs font-semibold"
    :class="pillClass('{{ option.color|default:'gray' }}')"
  >
    {{ option.label }}
  </span>
</button>
{% endfor %}
{% if next_url %}
  <div
    class="px-3 py-2 text-xs text-gc-light-text-secondary dark:text-gc-dark-text-primary/70"
    hx-get="{{ next_url }}"
    hx-trigger="loadmore"
    hx-swap="outerHTML"
    hx-target="this"
    data-load-more
  >
    Loading more...
  </div>
{% endif %}
