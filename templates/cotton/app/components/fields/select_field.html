<div class="space-y-1">
  <label class="block text-sm font-semibold text-gc-light-text-primary dark:text-gc-dark-text-primary" for="{{ id }}">{{ label }}</label>
  <select
    class="w-full h-12 rounded-lg border border-gc-theme-accent bg-gc-light-bg-primary dark:bg-gc-dark-bg-primary text-base text-gc-light-text-primary dark:text-gc-dark-text-primary px-3 shadow-sm focus:border-gc-theme-accent focus:ring-2 focus:ring-gc-theme-accent/40 focus:outline-none"
    id="{{ id }}"
    name="{{ name }}"
    {% if multiple %}multiple{% endif %}
    {% if size %}size="{{ size }}"{% endif %}
    {% if required %}required{% endif %}
    {% if disabled %}disabled{% endif %}
  >
    {% for option in options|default:[] %}
      {% with
        value=option.value|default_if_none:option.0|default_if_none:option
        label=option.label|default_if_none:option.1|default_if_none:option
      %}
        {% include "cotton/app/components/fields/select_option.html" %}
      {% endwith %}
    {% endfor %}
  </select>
</div>
