<div
  class="relative mb-3 flex items-center justify-between"
  x-data="{
    filtersOpen: false,
    searchUrl: '{{ search_url|default:request.path|default:'' }}',
    hxTarget: '{{ hx_target|default:'#crm_tab_content' }}',
    hxSelect: '{{ hx_select|default:'' }}',
    filterFormId: '{{ filter_form_id|default:'table_filters_form'|escapejs }}',
    clearFilters() {
      const root = this.$el;
      const form =
        this.$refs.filterForm ||
        (this.filterFormId ? document.getElementById(this.filterFormId) : null) ||
        root.querySelector('form');
      const wrappers = root.querySelectorAll('[data-table-filter-input]');
      wrappers.forEach((wrapper) => {
        wrapper.querySelectorAll('select').forEach((field) => {
          field.value = '';
          field.dispatchEvent(new Event('input', { bubbles: true }));
          field.dispatchEvent(new Event('change', { bubbles: true }));
        });
        wrapper.querySelectorAll('input[type=checkbox], input[type=radio]').forEach((field) => {
          field.checked = false;
          field.defaultChecked = false;
          field.dispatchEvent(new Event('input', { bubbles: true }));
          field.dispatchEvent(new Event('change', { bubbles: true }));
        });
      });

      const searchInput = root.querySelector('[data-table-search-input]');
      if (searchInput) {
        searchInput.value = '';
        searchInput.defaultValue = '';
        searchInput.dispatchEvent(new Event('input', { bubbles: true }));
        searchInput.dispatchEvent(new Event('change', { bubbles: true }));
      }

      const url = this.searchUrl || window.location.pathname;
      if (window.htmx && url) {
        const includeSelector = `[data-table-tools-hidden] input, [data-table-search-input], [data-table-filter-input] input, [data-table-filter-input] select, [data-table-filter-input] textarea`;
        const formData = new FormData();
        (form || root).querySelectorAll(includeSelector).forEach((el) => {
          if (!el.name || el.disabled) return;
          if ((el.type === 'checkbox' || el.type === 'radio') && !el.checked) return;
          formData.append(el.name, el.value ?? '');
        });
        htmx.ajax('GET', url, {
          target: this.hxTarget || undefined,
          swap: 'innerHTML',
          select: this.hxSelect || undefined,
          values: Object.fromEntries(formData),
        });
      }
    },
  }"
  @close-filters-drawer.window="filtersOpen = false"
>
  <div class="flex items-center gap-2">
    {{ slot }}
    <div class="hidden" data-table-tools-hidden>
      <input type="hidden" name="sort" value="{{ sort_field|default:'name' }}">
      <input type="hidden" name="direction" value="{{ sort_direction|default:'asc' }}">
    </div>
    <input
      type="search"
      name="search"
      value="{{ search_query|default:'' }}"
      placeholder="Search..."
      class="w-56 rounded-md border-2 border-gc-theme-accent/60 bg-gc-light-bg-primary dark:bg-gc-dark-bg-primary px-3 py-2 text-sm text-gc-light-text-primary dark:text-gc-dark-text-primary focus:outline-none focus:ring-2 focus:ring-gc-theme-accent/70"
      aria-label="Search table"
      data-table-search-input
      {% if search_url %}
      hx-get="{{ search_url|default:request.path|default:'' }}"
      hx-trigger="keyup changed delay:1s"
      hx-target="{{ hx_target|default:'#crm_tab_content' }}"
      hx-swap="innerHTML"
      hx-include="[data-table-tools-hidden] input, [data-table-search-input], [data-table-filter-input] input, [data-table-filter-input] select, [data-table-filter-input] textarea"
      {% if hx_select %}hx-select="{{ hx_select }}"{% endif %}
      {% endif %}
    />
  </div>
  <div class="flex items-center gap-2">
    {% if filter_fields %}
    <button
      type="button"
      class="inline-flex items-center gap-2 rounded-md border-2 border-gc-theme-accent/60 bg-gc-theme-accent/5 px-3 py-2 text-sm font-semibold text-gc-theme-accent transition hover:border-gc-theme-accent/80 focus:outline-none focus:ring-0"
      @click="filtersOpen = true"
    >
      <svg class="h-4 w-4 text-gc-theme-accent" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M3 5.5a1 1 0 011-1h12a1 1 0 011 1v1.1a1 1 0 01-.293.707L12 11.014v3.236a1 1 0 01-.553.894l-2.5 1.25A1 1 0 017 15.486v-4.472L3.293 7.307A1 1 0 013 6.6V5.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
      </svg>
      <span class="text-gc-theme-accent">Filters</span>
    </button>
    {% endif %}
    <c-slot name="actions"></c-slot>
    {% if not hide_default_add %}
    <button
      type="button"
      class="inline-flex items-center gap-2 rounded-md border-2 border-gc-theme-accent/60 bg-gc-theme-accent/10 px-3 py-2 text-sm font-semibold text-gc-theme-accent transition hover:bg-gc-theme-accent/20 focus:outline-none focus:ring-0"
      {% if add_onclick or add_open_event %}
      @click="
        {% if add_open_event %}$dispatch('{{ add_open_event }}');{% endif %}
        {% if add_onclick %}{{ add_onclick|escapejs }}{% endif %}
      "
      {% endif %}
      {% if add_url %}
      hx-get="{{ add_url }}"
      hx-target="{{ add_target|default:'#crm_tab_content' }}"
      hx-swap="{{ add_swap|default:'innerHTML' }}"
      {% if add_select %}hx-select="{{ add_select }}"{% endif %}
      {% endif %}
    >
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span>Add</span>
    </button>
    {% endif %}
  </div>

  {% if filter_fields %}
  <!-- Filter Tray -->
  <div
    x-show="filtersOpen"
    class="fixed inset-0 z-50"
    x-cloak
    x-transition.opacity
  >
    <div class="absolute inset-0 bg-black/50" @click="filtersOpen = false"></div>
    <aside
      class="absolute right-0 top-0 flex h-full w-96 max-w-full flex-col border-l border-gc-light-bg-secondary dark:border-gc-dark-bg-secondary bg-gc-light-bg-primary dark:bg-gc-dark-bg-primary text-gc-light-text-primary dark:text-gc-dark-text-primary shadow-2xl"
      x-transition:enter="transition transform ease-out duration-300"
      x-transition:enter-start="translate-x-full"
      x-transition:enter-end="translate-x-0"
      x-transition:leave="transition transform ease-in duration-200"
      x-transition:leave-start="translate-x-0"
      x-transition:leave-end="translate-x-full"
    >
      <c-app.components.drawers.drawer_header
        title="Filters"
        subtitle="Refine the results in this table."
        close_event="close-filters-drawer"
      />

      <form
        id="{{ filter_form_id|default:'table_filters_form' }}"
        class="flex h-full flex-col overflow-hidden"
        action="{{ search_url|default:request.path|default:'' }}"
        method="get"
        @submit="filtersOpen = false"
        x-ref="filterForm"
        {% if search_url %}
        hx-get="{{ search_url }}"
        hx-target="{{ hx_target|default:'#crm_tab_content' }}"
        hx-swap="innerHTML"
        hx-include="[data-table-tools-hidden] input, [data-table-search-input], [data-table-filter-input] input, [data-table-filter-input] select, [data-table-filter-input] textarea"
        {% if hx_select %}hx-select="{{ hx_select }}"{% endif %}
        {% endif %}
      >
        <div class="flex-1 space-y-4 overflow-y-auto px-4 py-4">
          {% for field in filter_fields %}
            <c-app.components.fields.text_field
              id="filter_{{ field.name }}"
              name="{{ field.name }}"
              label="{{ field.label }}"
              placeholder="{{ field.placeholder|default:'' }}"
              value="{{ field.value|default:'' }}"
              data-table-filter-input
            />
          {% endfor %}
        </div>
        <c-app.components.drawers.drawer_footer>
          <div class="flex items-center justify-end gap-2">
            <c-app.components.buttons.secondary_button
              type="button"
              label="Clear"
              extra_classes="px-3 py-2"
              @click.prevent="clearFormFields('{{ filter_form_id|escapejs }}'); clearFilters()"
            />
            <c-app.components.buttons.primary_button
              type="submit"
              label="Apply Filters"
              extra_classes="px-3 py-2"
            />
          </div>
        </c-app.components.drawers.drawer_footer>
      </form>
    </aside>
  </div>
  {% endif %}
</div>
