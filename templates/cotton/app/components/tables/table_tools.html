<div
  class="relative mb-3 flex items-center justify-between"
  x-data="{
    filtersOpen: false,
    clearFilters() {
      const inputs = this.$refs.filterForm?.querySelectorAll('[data-table-filter-input]') || [];
      inputs.forEach((input) => {
        input.value = '';
        input.defaultValue = '';
      });
    },
  }"
  @close-filters-drawer.window="filtersOpen = false"
>
  <div class="flex items-center gap-2">
    {{ slot }}
    <div class="hidden" data-table-tools-hidden>
      <input type="hidden" name="sort" value="{{ sort_field|default:'name' }}">
      <input type="hidden" name="direction" value="{{ sort_direction|default:'asc' }}">
    </div>
    <input
      type="search"
      name="search"
      value="{{ search_query|default:'' }}"
      placeholder="Search..."
      class="w-56 rounded-md border-2 border-gc-theme-accent/60 bg-gc-light-bg-primary dark:bg-gc-dark-bg-primary px-3 py-2 text-sm text-gc-light-text-primary dark:text-gc-dark-text-primary focus:outline-none focus:ring-2 focus:ring-gc-theme-accent/70"
      aria-label="Search table"
      data-table-search-input
      {% if search_url %}
      hx-get="{{ search_url }}"
      hx-trigger="keyup changed delay:1s"
      hx-target="{{ hx_target|default:'#crm_tab_content' }}"
      hx-swap="innerHTML"
      hx-include="[data-table-tools-hidden], [data-table-filter-input]"
      {% if hx_select %}hx-select="{{ hx_select }}"{% endif %}
      {% endif %}
    />
  </div>
  <div class="flex items-center gap-2">
    {% if filter_fields %}
    <button
      type="button"
      class="inline-flex items-center gap-2 rounded-md border-2 border-gc-theme-accent/60 bg-gc-theme-accent/5 px-3 py-2 text-sm font-semibold text-gc-theme-accent transition hover:border-gc-theme-accent/80 focus:outline-none focus:ring-0"
      @click="filtersOpen = true"
    >
      <svg class="h-4 w-4 text-gc-theme-accent" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M3 5.5a1 1 0 011-1h12a1 1 0 011 1v1.1a1 1 0 01-.293.707L12 11.014v3.236a1 1 0 01-.553.894l-2.5 1.25A1 1 0 017 15.486v-4.472L3.293 7.307A1 1 0 013 6.6V5.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
      </svg>
      <span class="text-gc-theme-accent">Filters</span>
    </button>
    {% endif %}
    <c-slot name="actions"></c-slot>
    <c-app.components.buttons.add_button />
  </div>

  {% if filter_fields %}
  <!-- Filter Tray -->
  <div
    x-show="filtersOpen"
    class="fixed inset-0 z-50"
    x-cloak
    x-transition.opacity
  >
    <div class="absolute inset-0 bg-black/50" @click="filtersOpen = false"></div>
    <aside
      class="absolute right-0 top-0 flex h-full w-96 max-w-full flex-col border-l border-gc-light-bg-secondary dark:border-gc-dark-bg-secondary bg-gc-light-bg-primary dark:bg-gc-dark-bg-primary text-gc-light-text-primary dark:text-gc-dark-text-primary shadow-2xl"
      x-transition:enter="transition transform ease-out duration-300"
      x-transition:enter-start="translate-x-full"
      x-transition:enter-end="translate-x-0"
      x-transition:leave="transition transform ease-in duration-200"
      x-transition:leave-start="translate-x-0"
      x-transition:leave-end="translate-x-full"
    >
      <c-app.components.drawers.drawer_header
        title="Filters"
        subtitle="Refine the results in this table."
        close_event="close-filters-drawer"
      />

      <form
        class="flex h-full flex-col overflow-hidden"
        action="{{ search_url|default:'' }}"
        method="get"
        @submit="filtersOpen = false"
        x-ref="filterForm"
        {% if search_url %}
        hx-get="{{ search_url }}"
        hx-target="{{ hx_target|default:'#crm_tab_content' }}"
        hx-swap="innerHTML"
        hx-include="[data-table-tools-hidden], [data-table-search-input], [data-table-filter-input]"
        {% if hx_select %}hx-select="{{ hx_select }}"{% endif %}
        {% endif %}
      >
        <div class="flex-1 space-y-4 overflow-y-auto px-4 py-4">
          {% for field in filter_fields %}
            <c-app.components.fields.text_field
              id="filter_{{ field.name }}"
              name="{{ field.name }}"
              label="{{ field.label }}"
              placeholder="{{ field.placeholder|default:'' }}"
              value="{{ field.value|default:'' }}"
              data-table-filter-input
            />
          {% endfor %}
        </div>
        <c-app.components.drawers.drawer_footer>
          <div class="flex items-center justify-end gap-2">
            <button
              type="button"
              class="rounded-md border border-gc-light-bg-secondary dark:border-gc-dark-bg-secondary px-3 py-2 text-sm font-semibold text-gc-light-text-primary dark:text-gc-dark-text-primary hover:border-gc-theme-accent/40 hover:text-gc-theme-accent transition"
              @click="clearFilters()"
              {% if search_url %}
              hx-get="{{ search_url }}"
              hx-target="{{ hx_target|default:'#crm_tab_content' }}"
              hx-swap="innerHTML"
              hx-include="[data-table-tools-hidden], [data-table-search-input]"
              {% if hx_select %}hx-select="{{ hx_select }}"{% endif %}
              {% endif %}
            >
              Clear
            </button>
            <button
              type="submit"
              class="inline-flex items-center gap-2 rounded-md border border-gc-theme-accent/30 bg-gc-theme-accent/10 px-3 py-2 text-sm font-semibold text-gc-theme-accent transition hover:bg-gc-theme-accent/20 focus:outline-none focus:ring-0"
            >
              Apply Filters
            </button>
          </div>
        </c-app.components.drawers.drawer_footer>
      </form>
    </aside>
  </div>
  {% endif %}
</div>
