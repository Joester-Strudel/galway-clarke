<button
  type="{{ type|default:'button' }}"
  {% if form %}form="{{ form }}"{% endif %}
  class="inline-flex items-center justify-center gap-2 rounded-lg bg-gc-theme-accent px-4 py-3 text-sm font-semibold text-white transition hover:bg-gc-theme-accent/90 {{ extra_classes|default:'' }}"
>
  {% if icon %}
  <span class="material-symbols-outlined text-base leading-none">{{ icon }}</span>
  {% endif %}
  {{ label|default:slot }}
</button>
