<button
  type="{{ type|default:'button' }}"
  {% if form %}form="{{ form }}"{% endif %}
  class="inline-flex items-center justify-center gap-2 rounded-lg border border-gc-light-bg-secondary dark:border-gc-dark-bg-secondary bg-gc-light-bg-primary dark:bg-gc-dark-bg-primary px-4 py-3 text-sm font-semibold text-gc-light-text-primary dark:text-gc-dark-text-primary transition hover:border-gc-theme-accent/50 hover:text-gc-theme-accent {{ extra_classes|default:'' }}"
>
  {% if icon %}
  <span class="material-symbols-outlined text-base leading-none">{{ icon }}</span>
  {% endif %}
  {{ label|default:slot }}
</button>
